name: Android (Google Play)

# Compila el AAB de release (R8), lo firma con la upload key y lo sube a una
# pista de prueba de Google Play. Mismo esquema que sesolibre-mind.
#
# Se dispara al publicar un tag de versión (git tag v0.2.5 && git push origin v0.2.5)
# o a mano (Actions → Android (Google Play) → Run workflow), con o sin subir.
#
# Secrets del repositorio:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD   upload key
#   PLAY_SERVICE_ACCOUNT_JSON   cuenta de servicio con permiso de publicar
# Variable opcional del repositorio: PLAY_TRACK (pista de destino; por omisión «internal»).
#
# versionCode = nº de commits (lo calcula app/build.gradle.kts, igual que en local);
# versionName = appVersionName de app/build.gradle.kts. Notas: docs/release-notes.txt.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload:
        description: "Subir a Google Play"
        type: boolean
        default: true

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el versionCode es el nº de commits

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Nada se publica si fallan las pruebas o el lint.
      - name: Pruebas y lint
        run: ./gradlew testDebugUnitTest lintDebug

      # Reconstruye el keystore y sus credenciales desde los Secrets del repo.
      # NUNCA se guardan en git; solo viven en el runner efímero de esta corrida.
      - name: Restaurar el keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret KEYSTORE_BASE64 (y compañía)."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/upload-keystore.jks
          {
            echo "storeFile=keystore/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Compilar y firmar el AAB
        run: |
          ./gradlew :app:bundleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tail -n 1
          echo "versionCode: $(git rev-list --count HEAD)"

      - name: Pistas de Google Play (comprueba el acceso de la cuenta de servicio)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/android/play.mjs tracks

      - name: Subir a Google Play
        if: github.event_name == 'push' || inputs.upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/android/play.mjs upload app/build/outputs/bundle/release/app-release.aab "$PLAY_TRACK" \
            app/build/outputs/mapping/release/mapping.txt docs/release-notes.txt

      - name: Guardar el AAB como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: somnia-aab-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Borrar el material de firma
        if: always()
        run: rm -f keystore.properties keystore/upload-keystore.jks
