# Proyecto de Xcode para la app de iOS. El .xcodeproj NO se versiona: CI lo
# genera con `xcodegen generate` (no hay Mac en desarrollo).
name: Somnia
options:
  bundleIdPrefix: com.sesolibre
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: PLNS58WDQF
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Somnia:
    type: application
    platform: iOS
    sources:
      - path: Somnia
    info:
      path: Somnia/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sesolibre.somnia
        PRODUCT_NAME: Somnia
        INFOPLIST_FILE: Somnia/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        # Firma manual solo para dispositivo (Release / App Store). El
        # simulador (pruebas) no firma.
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "Somnia App Store"
    scheme:
      testTargets:
        - SomniaTests

  SomniaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SomniaTests
    dependencies:
      - target: Somnia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sesolibre.somnia.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Somnia.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Somnia"
        BUNDLE_LOADER: "$(TEST_HOST)"
